[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image-classifier"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "timm",
    "grad-cam",
    "scikit-learn",
    "gradio",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
